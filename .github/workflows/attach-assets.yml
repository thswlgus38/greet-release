name: Attach release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.2.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.14"
      - run: uv build
      - run: gh release upload v0.2.0 dist/greet_week10-0.2.0-py3-none-any.whl dist/greet_week10-0.2.0.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
